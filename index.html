<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISK 管理</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:1050px;margin:auto;padding:22px 12px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #dfe5ef;border-radius:9px;margin:4px 0}.btn{display:inline-block;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;margin:3px;text-decoration:none}.primary{background:#315be8;color:#fff}.danger{background:#ffebee;color:#a52e3c}.ok{background:#e9f8f1}.warn{background:#fff5dc}.line{background:#e8f8ee;color:#0b6b3a}.muted{color:#70798b;font-size:13px}.person{border-top:1px solid #eee;padding:10px 0}.desired{background:#eef4ff;border-radius:10px;padding:9px;margin:7px 0;font-weight:900;line-height:1.6}.commentbox{background:#f7f9fc;border-left:4px solid #315be8;border-radius:8px;padding:9px 11px;margin:8px 0;white-space:pre-wrap}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.count{background:#f7f9fc;border-radius:12px;padding:10px;text-align:center}.count b{display:block;font-size:22px}@media(max-width:700px){.counts{grid-template-columns:1fr 1fr}}.history{font-size:13px;padding:6px 0;border-bottom:1px solid #eee}.tabs{display:flex;gap:7px;overflow:auto;margin:7px 0}.tabs button{white-space:nowrap;border:1px solid #ccd4e2;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.tabs .on{background:#315be8;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>ASTERISK 管理者ページ</h1><section id="login" class="card"><input id="pin" type="password" placeholder="管理PIN"><button class="btn primary" onclick="loginNow()">ログイン</button></section><div id="app" hidden><section class="card"><h2>一括追加・一括更新</h2><p class="muted">1行につき「日付,曜日,開始,終了,レベル/タイトル,会場,定員,参加費」の順で入力してください。</p><textarea id="bulk" rows="7" placeholder="2026-09-12,土,18:00,21:00,🌸,練馬特別支援,20,400"></textarea><button class="btn primary" onclick="bulkSave()">一括反映</button></section><div id="months" class="tabs"></div><div id="marks" class="tabs"></div><section class="card"><h2>ビジター出欠・申請者情報</h2><div id="visitors"></div></section><section><h2>各回ごとの変更</h2><div id="eventList"></div></section><section class="card"><h2>変更履歴</h2><div id="history"></div></section></div></main><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/attendance-api',MARKS=['🚹️','⭐','🌺','🌸','💎','🏐','✡️','🌠'];let P='',D={events:[],responses:[],visitors:[],history:[]},month='all',mark='all';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function call(a,b){const r=await fetch(API+'?action='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}),j=await r.json();if(!r.ok)throw Error(j.error||'通信エラー');return j}async function loginNow(){try{P=pin.value;await call('admin-login',{pin:P});login.hidden=true;app.hidden=false;await load()}catch(e){alert(e.message)}}async function load(){D=await call('admin-bootstrap',{pin:P});render()}function pickMonth(x){month=x;render()}function pickMark(x){mark=x;render()}function eventById(id){return D.events.find(e=>e.id===id)}function eventLine(e){if(!e)return'日程情報なし';return esc(e.event_date||'')+' '+esc(e.day_label||'')+' '+String(e.start_time||'').slice(0,5)+'-'+String(e.end_time||'').slice(0,5)+' / '+esc(e.venue||'')}function render(){const ms=[...new Set(D.events.map(e=>String(e.event_date).slice(0,7)))].sort();months.innerHTML=[['all','すべて'],...ms.map(x=>[x,+x.slice(5)+'月'])].map(x=>'<button class="'+(month===x[0]?'on':'')+'" onclick="pickMonth(\''+x[0]+'\')">'+x[1]+'</button>').join('');marks.innerHTML=[['all','全マーク'],...MARKS.map(x=>[x,x])].map(x=>'<button class="'+(mark===x[0]?'on':'')+'" onclick="pickMark(\''+x[0]+'\')">'+x[1]+'</button>').join('');const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(new Date()),es=D.events.filter(e=>String(e.event_date)>=today&&(month==='all'||String(e.event_date).startsWith(month))&&(mark==='all'||String(e.title).includes(mark))),ids=new Set(es.map(e=>e.id)),friendCount=D.responses.filter(r=>ids.has(r.event_id)&&r.status==='yes').reduce((n,r)=>n+Number(r.guest_count||0),0);eventList.innerHTML=es.map(e=>{const rs=D.responses.filter(r=>r.event_id===e.id),vs=D.visitors.filter(v=>v.event_id===e.id),memberYes=rs.filter(r=>r.status==='yes').length,memberFriends=rs.filter(r=>r.status==='yes').reduce((n,r)=>n+Number(r.guest_count||0),0),visitorApproved=vs.filter(v=>v.status==='approved').reduce((n,v)=>n+1+Number(v.guest_count||0),0),visitorPending=vs.filter(v=>v.status==='pending').reduce((n,v)=>n+1+Number(v.guest_count||0),0),visitorApplied=visitorApproved+visitorPending,memberApplied=rs.filter(r=>['yes','waitlist','maybe'].includes(r.status)).reduce((n,r)=>n+1+Number(r.guest_count||0),0),applied=memberApplied+visitorApplied,participating=memberYes+memberFriends+visitorApproved;return '<section class="card"><h2>'+esc(e.event_date)+' '+esc(e.day_label||'')+' '+String(e.start_time||'').slice(0,5)+'-'+String(e.end_time||'').slice(0,5)+'｜'+esc(e.venue||'')+'</h2><div class="counts"><div class="count">この回の申請<b>'+applied+'人</b><span class="muted">正規 '+memberApplied+' / ビジター '+visitorApplied+'</span></div><div class="count">この回の参加確定<b>'+participating+'人</b><span class="muted">正規・友人・承認済ビジター</span></div><div class="count">残り枠<b>'+Math.max(0,Number(e.capacity||20)-participating)+'人</b></div></div><div class="grid"><input id="d-'+e.id+'" type="date" value="'+esc(e.event_date)+'"><input id="w-'+e.id+'" value="'+esc(e.day_label||'')+'"><input id="s-'+e.id+'" type="time" value="'+String(e.start_time).slice(0,5)+'"><input id="x-'+e.id+'" type="time" value="'+String(e.end_time).slice(0,5)+'"><input id="t-'+e.id+'" value="'+esc(e.title)+'"><input id="v-'+e.id+'" value="'+esc(e.venue)+'"><input id="cap-'+e.id+'" type="number" value="'+e.capacity+'"><input id="fee-'+e.id+'" type="number" value="'+Number(e.participation_fee||400)+'"></div><textarea id="n-'+e.id+'">'+esc(e.note||'')+'</textarea><select id="h-'+e.id+'"><option value="false" '+(!e.is_hidden?'selected':'')+'>表示</option><option value="true" '+(e.is_hidden?'selected':'')+'>非表示</option></select><button class="btn primary" onclick="saveEvent(\''+e.id+'\')">保存</button><button class="btn danger" onclick="delEvent(\''+e.id+'\')">削除</button>'+rs.map(r=>'<div class="person"><b>正規メンバー '+esc(r.display_name||'')+(Number(r.guest_count||0)>0?' ＋ 友人'+Number(r.guest_count||0)+'人':'')+'</b><select id="rs-'+r.id+'"><option value="yes" '+(r.status==='yes'?'selected':'')+'>参加</option><option value="waitlist" '+(r.status==='waitlist'?'selected':'')+'>キャンセル待ち</option><option value="maybe" '+(r.status==='maybe'?'selected':'')+'>未定</option><option value="no" '+(r.status==='no'?'selected':'')+'>不参加</option></select><div class="commentbox"><b>💬 コメント</b><br>'+(r.comment?esc(r.comment):'<span class="muted">コメントなし</span>')+'</div><input id="rc-'+r.id+'" value="'+esc(r.comment||'')+'" placeholder="コメントを修正"><button class="btn primary" onclick="saveResponse(\''+r.id+'\')">出欠変更</button></div>').join('')+'</section>'}).join('')||'<div class="card muted">条件に合う日程はありません。</div>';visitors.innerHTML='<div class="desired">👥 正規メンバーの友人参加：合計 '+friendCount+'人</div>'+D.visitors.filter(v=>ids.has(v.event_id)).sort((a,b)=>{const ea=eventById(a.event_id),eb=eventById(b.event_id),ka=String(ea?.event_date||'')+String(ea?.start_time||'')+String(ea?.venue||''),kb=String(eb?.event_date||'')+String(eb?.start_time||'')+String(eb?.venue||'');return ka.localeCompare(kb)}).map(v=>{const e=eventById(v.event_id),line=String(v.contact||v.line_url||'').trim(),lineBtn=line?'<a class="btn line" href="'+esc(line)+'" target="_blank" rel="noopener noreferrer">📱 LINEを開く</a>':'';return '<div class="person"><b>'+esc(v.display_name)+'（ビジター）</b><div class="desired">📅 参加希望日：'+eventLine(e)+'<br>'+esc(e?.title||'')+'</div><div style="margin:7px 0;font-weight:900">'+(v.status==='approved'?'<span style="background:#dff7e8;color:#08733f;padding:6px 10px;border-radius:999px">✅ 参加確定済み</span>':v.status==='pending'?'<span style="background:#fff3cd;color:#805b00;padding:6px 10px;border-radius:999px">⏳ 承認待ち</span>':v.status==='rejected'?'<span style="background:#fde8e8;color:#a52e3c;padding:6px 10px;border-radius:999px">❌ 却下済み</span>':'<span style="background:#edf0f5;color:#566070;padding:6px 10px;border-radius:999px">キャンセル済み</span>')+'</div><div class="muted">性別 '+esc(v.gender||'')+'・年齢 '+esc(v.age||'')+'・バレー歴 '+esc(v.volleyball_history||'')+'<br>LINE '+esc(line)+'</div><div class="commentbox"><b>💬 申請コメント</b><br>'+(v.comment?esc(v.comment):'<span class="muted">コメントなし</span>')+'</div>'+lineBtn+'<button class="btn ok" '+(v.status==='approved'?'disabled style="opacity:.55"':'')+' onclick="vstat(\''+v.id+'\',\'approved\')">'+(v.status==='approved'?'✓ 参加確定済み':'参加確定')+'</button><button class="btn warn" onclick="vstat(\''+v.id+'\',\'pending\')">承認待ち</button><button class="btn danger" onclick="vstat(\''+v.id+'\',\'rejected\')">不参加</button><button class="btn" onclick="vstat(\''+v.id+'\',\'cancelled\')">'+(v.status==='rejected'?'却下→キャンセル':'解除')+'</button>'+(v.status==='cancelled'?'<button class="btn ok" onclick="vstat(\''+v.id+'\',\'pending\')">↩️ 申請を復活</button>':'')+(v.status==='rejected'?'<button class="btn danger" onclick="deleteRejectedVisitor(\''+v.id+'\')">却下申請を削除</button>':'')+'</div>'}).join('')||'<div class="muted">該当する申請はありません。</div>';history.innerHTML=(D.history||[]).map(h=>'<div class="history">'+esc(h.created_at||'')+'　'+esc(h.display_name||'')+'　'+esc(h.action||'')+' <button class="btn danger" onclick="deleteHistory('+Number(h.id)+')">削除</button></div>').join('')||'<div class="muted">履歴はありません。</div>'}async function deleteHistory(id){if(!confirm('この履歴を削除しますか？'))return;try{await call('admin-delete-history',{pin:P,id});await load()}catch(e){alert(e.message)}}async function saveEvent(id){try{await call('admin-update-event',{pin:P,id,event_date:document.getElementById('d-'+id).value,day_label:document.getElementById('w-'+id).value,start_time:document.getElementById('s-'+id).value,end_time:document.getElementById('x-'+id).value,title:document.getElementById('t-'+id).value,venue:document.getElementById('v-'+id).value,capacity:+document.getElementById('cap-'+id).value,participation_fee:+document.getElementById('fee-'+id).value,note:document.getElementById('n-'+id).value,is_hidden:document.getElementById('h-'+id).value==='true',paypay_enabled:false,tags:''});await load();alert('保存しました')}catch(e){alert(e.message)}}async function delEvent(id){if(!confirm('この日程を削除しますか？'))return;try{await call('admin-delete-event',{pin:P,id});await load()}catch(e){alert(e.message)}}async function saveResponse(id){try{await call('admin-change-response',{pin:P,id,status:document.getElementById('rs-'+id).value,comment:document.getElementById('rc-'+id).value});await load();alert('出欠を変更しました')}catch(e){alert(e.message)}}async function vstat(id,status){try{await call('admin-visitor-status',{pin:P,id,status});await load()}catch(e){alert(e.message)}}async function restoreVisitor(id){if(!confirm('このキャンセル済み申請を承認待ちへ戻しますか？'))return;try{await vstat(id,'pending')}catch(e){alert(e.message)}}async function deleteRejectedVisitor(id){if(!confirm('この却下済み申請を削除しますか？'))return;try{await call('admin-delete-rejected-visitor',{pin:P,id});await load()}catch(e){alert(e.message)}}async function bulkSave(){const events=bulk.value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split(',').map(x=>x.trim());return{event_date:a[0],day_label:a[1],start_time:a[2],end_time:a[3],title:a[4],venue:a[5],capacity:+(a[6]||20),participation_fee:+(a[7]||400),paypay_enabled:false,note:'',tags:'',is_hidden:false}});if(!events.length)return alert('日程を入力してください');try{await call('admin-upsert-events',{pin:P,events});await load();alert('一括反映しました')}catch(e){alert(e.message)}}<!-- deploy-admin-controls-20260920 --></script></body></html>
