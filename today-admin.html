<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本日のビジター管理</title><style>body{font-family:system-ui;background:#f5f7fb;margin:0;color:#172033}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:15px;padding:13px;margin:10px 0}.event{font-weight:900;font-size:17px}.person{border-top:1px solid #eee;padding:12px 0}.btn{display:inline-block;border:0;border-radius:9px;padding:10px 13px;margin:4px;font-weight:900;text-decoration:none}.ok{background:#daf5e6;color:#076b3a}.line{background:#dff7e8;color:#08733f}.wait{background:#fff3cd}.muted{color:#687386;font-size:13px}</style></head><body><main><h1>9/22 ビジター管理</h1><div class="card"><b>今日の申請者一覧</b><div class="muted">LINEボタンは申請者ごとに表示されます。</div></div><div id="status" class="card">申請者を読み込み中…</div><div id="list"></div></main><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/attendance-api',PIN='20190512';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function get(){const r=await fetch(API+'?action=admin-today-visitors&p='+PIN+'&date=2026-09-22&_='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function post(a,b){const r=await fetch(API+'?action='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'エラー');return j}async function approve(id){if(!confirm('参加確定にしますか？'))return;await post('admin-visitor-status',{pin:PIN,id,status:'approved'});await load()}async function load(){try{status.textContent='申請者データを取得中…';const d=await get();status.textContent='取得完了';list.innerHTML=(d.events||[]).map(e=>{const vs=(d.visitors||[]).filter(v=>v.event_id===e.id);if(!vs.length)return'';return '<section class="card"><div class="event">'+e.start_time.slice(0,5)+'-'+e.end_time.slice(0,5)+'｜'+esc(e.venue)+'｜'+esc(e.title||'')+'</div>'+vs.map(v=>'<div class="person"><b>'+esc(v.display_name)+'</b>'+(Number(v.guest_count||0)?' ＋友人'+v.guest_count+'人':'')+'<div class="muted">'+(v.status==='approved'?'✅参加確定':v.status==='pending'?'⏳承認待ち':v.status==='cancelled'?'キャンセル':'❌却下')+'</div>'+(v.comment?'<div>'+esc(v.comment)+'</div>':'')+'<div>'+(v.status!=='approved'?'<button class="btn ok" onclick="approve(\''+v.id+'\')">✅ 承認</button>':'')+(v.line_url?'<button type="button" class="btn line" onclick="location.href='"+esc(v.line_url)+"'">📱 LINEを開く</button>':'<span class="muted">LINE未登録</span>')+'</div></div>').join('')+'</section>'}).join('')||'<div class="card">本日の申請はありません。</div>'}catch(e){status.textContent='読込エラー：'+e.message}}load();</script></body></html>
