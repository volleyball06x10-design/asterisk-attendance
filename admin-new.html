<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISK 管理 新版</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:1050px;margin:auto;padding:22px 12px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #dfe5ef;border-radius:9px;margin:4px 0}.btn{display:inline-block;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;margin:3px;text-decoration:none}.primary{background:#315be8;color:#fff}.danger{background:#ffebee;color:#a52e3c}.ok{background:#e9f8f1}.warn{background:#fff5dc}.line{background:#e8f8ee;color:#0b6b3a}.muted{color:#70798b;font-size:13px}.person{border-top:1px solid #eee;padding:10px 0}.desired{background:#eef4ff;border-radius:10px;padding:9px;margin:7px 0;font-weight:900;line-height:1.6}.commentbox{background:#f7f9fc;border-left:4px solid #315be8;border-radius:8px;padding:9px 11px;margin:8px 0;white-space:pre-wrap}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.count{background:#f7f9fc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;text-align:center;font-weight:800}.count b{display:block;font-size:24px;margin-top:3px}.eventGroup{border:2px solid #dfe5ef;border-radius:18px;margin:16px 0;overflow:hidden;background:#fff}.eventHead{padding:14px 16px;background:#eef4ff;cursor:pointer}.eventTitle{font-size:18px;font-weight:900;line-height:1.5}.applicant{border:1px solid #e4e8f0;border-radius:14px;padding:12px;margin:10px 0;background:#fff}.applicantName{font-size:17px;font-weight:900}.visitorBody{padding:4px 14px 14px}.statusline{margin:8px 0}.visitorActions{display:flex;gap:5px;flex-wrap:wrap}.visitorActions .btn{margin:2px}.sectionHint{font-size:13px;color:#64748b;margin-top:3px}@media(max-width:700px){.counts{grid-template-columns:1fr 1fr}}.history{font-size:13px;padding:6px 0;border-bottom:1px solid #eee}.tabs{display:flex;gap:7px;overflow:auto;margin:7px 0}.tabs button{white-space:nowrap;border:1px solid #ccd4e2;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.tabs .on{background:#315be8;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>ASTERISK 管理者ページ</h1><div id="app"><section id="staticLoadStatus" class="card" style="border:2px solid #315be8"><b>管理データを読み込んでいます…</b><div class="muted">この表示が消えない場合は読み込み処理に問題があります。</div></section><section class="card"><h2>一括追加・一括更新</h2><p class="muted">1行につき「日付,曜日,開始,終了,レベル/タイトル,会場,定員,参加費」の順で入力してください。</p><textarea id="bulk" rows="7" placeholder="2026-09-12,土,18:00,21:00,🌸,練馬特別支援,20,400"></textarea><button class="btn primary" onclick="bulkSave()">一括反映</button></section><div id="months" class="tabs"></div><div id="marks" class="tabs"></div><section class="card"><details><summary style="font-weight:900;font-size:18px;cursor:pointer">👥 正規メンバー登録状況 <span id="memberCount"></span></summary><div id="genderCount" class="counts"></div><details><summary style="font-weight:800;cursor:pointer;padding:10px 0">📋 メンバー一覧を表示</summary><div id="members"></div></details></details></section><section class="card"><h2>ビジター出欠・申請者情報</h2><div id="visitors"></div></section><section><h2>各回ごとの変更</h2><div id="eventList"></div></section><section class="card"><h2>変更履歴</h2><div id="history"></div></section></div></main><script>const ADMIN_PIN='20190512',API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/attendance-api',MARKS=['🚹️','⭐','🌺','🌸','💎','🏐','✡️','🌠'];let P=ADMIN_PIN,D={events:[],responses:[],visitors:[],history:[],members:[]},month='all',mark='all';const months=document.getElementById('months'),marks=document.getElementById('marks'),memberCount=document.getElementById('memberCount'),genderCount=document.getElementById('genderCount'),members=document.getElementById('members'),visitors=document.getElementById('visitors'),eventList=document.getElementById('eventList'),history=document.getElementById('history'),bulk=document.getElementById('bulk');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function call(a,b){const r=await fetch(API+'?action='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}),j=await r.json();if(!r.ok)throw Error(j.error||'通信エラー');return j}async function load(){D=await call('admin-bootstrap',{pin:P});render()}function pickMonth(x){month=x;render()}function pickMark(x){mark=x;render()}function eventById(id){return D.events.find(e=>e.id===id)}function eventLine(e){if(!e)return'日程情報なし';return esc(e.event_date||'')+' '+esc(e.day_label||'')+' '+String(e.start_time||'').slice(0,5)+'-'+String(e.end_time||'').slice(0,5)+' / '+esc(e.venue||'')}function render(){try{var all=D.members||[],male=all.filter(function(m){return m.gender==='男性'}).length,female=all.filter(function(m){return m.gender==='女性'}).length;memberCount.textContent='（'+all.length+'人）';genderCount.innerHTML='<div class="count">男性<b>'+male+'人</b></div><div class="count">女性<b>'+female+'人</b></div><div class="count">未設定<b>'+(all.length-male-female)+'人</b></div>';members.innerHTML=all.map(function(m){return '<div class="person"><b>'+esc(m.display_name||'')+'</b><div class="muted">本名：'+esc(m.real_name||'')+' ／ 性別：'+esc(m.gender||'未設定')+' ／ 登録日：'+esc(String(m.created_at||'').slice(0,10))+'</div></div>'}).join('')||'<div class="muted">登録メンバーはいません。</div>';var vs=D.visitors||[];visitors.innerHTML='<div class="counts"><div class="count">申請データ<b>'+vs.length+'件</b></div><div class="count">参加確定<b>'+vs.filter(function(v){return v.status==='approved'}).length+'件</b></div><div class="count">承認待ち<b>'+vs.filter(function(v){return v.status==='pending'}).length+'件</b></div></div>'+vs.map(function(v){return '<div class="applicant"><div class="applicantName">👤 '+esc(v.display_name||'')+'</div><div class="statusline">'+esc(v.status||'')+'</div><div class="muted">性別 '+esc(v.gender||'')+' ／ 年齢 '+esc(v.age||'')+' ／ バレー歴 '+esc(v.volleyball_history||'')+'</div><div class="commentbox"><b>💬 コメント</b><br>'+esc(v.comment||'コメントなし')+'</div></div>'}).join('');months.innerHTML='';marks.innerHTML='';eventList.innerHTML='<div class="card muted">日程別管理はメンバー・申請者一覧の表示確認後に読み込みます。</div>';history.innerHTML='';}catch(e){var s=document.getElementById('staticLoadStatus');if(s)s.innerHTML='<b>表示エラー</b><div class="muted">'+esc(e.message)+'</div>';throw e}}async function deleteHistory(id){if(!confirm('この履歴を削除しますか？'))return;try{await call('admin-delete-history',{pin:P,id});await load()}catch(e){alert(e.message)}}async function saveEvent(id){try{await call('admin-update-event',{pin:P,id,event_date:document.getElementById('d-'+id).value,day_label:document.getElementById('w-'+id).value,start_time:document.getElementById('s-'+id).value,end_time:document.getElementById('x-'+id).value,title:document.getElementById('t-'+id).value,venue:document.getElementById('v-'+id).value,capacity:+document.getElementById('cap-'+id).value,participation_fee:+document.getElementById('fee-'+id).value,note:document.getElementById('n-'+id).value,is_hidden:document.getElementById('h-'+id).value==='true',paypay_enabled:false,tags:''});await load();alert('保存しました')}catch(e){alert(e.message)}}async function delEvent(id){if(!confirm('この日程を削除しますか？'))return;try{await call('admin-delete-event',{pin:P,id});await load()}catch(e){alert(e.message)}}async function cancelMember(id){if(!confirm('この正規メンバーの参加をキャンセルしますか？'))return;try{await call('admin-change-response',{pin:P,id,status:'no',comment:'代表者が参加をキャンセル'});await load();alert('参加をキャンセルしました')}catch(e){alert(e.message)}}async function saveResponse(id){try{await call('admin-change-response',{pin:P,id,status:document.getElementById('rs-'+id).value,comment:document.getElementById('rc-'+id).value});await load();alert('出欠を変更しました')}catch(e){alert(e.message)}}async function moveVisitor(id){const s=document.getElementById('vm-'+id);if(!s||!s.value)return alert('同日に変更できる別の練習回がありません');if(!confirm('この申請を選択した練習回へ変更しますか？'))return;try{await call('admin-move-visitor',{pin:P,id,event_id:s.value});await load();alert('練習回を変更しました')}catch(e){alert(e.message)}}async function saveVisitor(id){try{await call('admin-edit-visitor',{pin:P,id,display_name:document.getElementById('vn-'+id).value,gender:document.getElementById('vg-'+id).value,age:document.getElementById('va-'+id).value,volleyball_history:document.getElementById('vh-'+id).value,desired_position:document.getElementById('vp-'+id).value,contact:document.getElementById('vc-'+id).value,guest_count:+document.getElementById('vgu-'+id).value,comment:document.getElementById('vco-'+id).value});await load();alert('申請内容を修正しました')}catch(e){alert(e.message)}}async function vstat(id,status){try{await call('admin-visitor-status',{pin:P,id,status});await load()}catch(e){alert(e.message)}}async function restoreVisitor(id){if(!confirm('このキャンセル済み申請を承認待ちへ戻しますか？'))return;try{await vstat(id,'pending')}catch(e){alert(e.message)}}async function deleteRejectedVisitor(id){if(!confirm('この却下済み申請を削除しますか？'))return;try{await call('admin-delete-rejected-visitor',{pin:P,id});await load()}catch(e){alert(e.message)}}async function bulkSave(){const events=bulk.value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split(',').map(x=>x.trim());return{event_date:a[0],day_label:a[1],start_time:a[2],end_time:a[3],title:a[4],venue:a[5],capacity:+(a[6]||20),participation_fee:+(a[7]||400),paypay_enabled:false,note:'',tags:'',is_hidden:false}});if(!events.length)return alert('日程を入力してください');try{await call('admin-upsert-events',{pin:P,events});await load();alert('一括反映しました')}catch(e){alert(e.message)}}function bootAdminView(){var st=document.getElementById('staticLoadStatus');st.innerHTML='<b>メンバー・申請者データを分割読込中…</b>';Promise.all([fetch(API+'?action=admin-members-view&p='+encodeURIComponent(P)+'&_='+Date.now()).then(r=>r.json()),fetch(API+'?action=admin-visitors-view&p='+encodeURIComponent(P)+'&_='+Date.now()).then(r=>r.json())]).then(function(a){D.members=a[0].members||[];D.visitors=a[1].visitors||[];D.events=[];D.responses=[];D.history=[];render();st.remove()}).catch(function(e){st.innerHTML='<b>読込エラー</b><div class="muted">'+esc(e.message)+'</div>'});return;var x=new XMLHttpRequest();x.open('GET',API+'?action=admin-bootstrap-view&p='+encodeURIComponent(P)+'&_='+Date.now(),true);x.timeout=15000;x.onreadystatechange=function(){if(x.readyState===2)st.innerHTML='<b>サーバーに接続しました。データ受信中…</b>';};x.onload=function(){try{if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText.slice(0,120));D=JSON.parse(x.responseText);render();if(st)st.remove()}catch(e){st.innerHTML='<b>管理データ読込エラー</b><div class="muted">'+esc(e.message)+'</div>'}};x.onerror=function(){st.innerHTML='<b>通信エラー</b><div class="muted">管理データに接続できません</div>'};x.ontimeout=function(){st.innerHTML='<b>通信タイムアウト</b><div class="muted">15秒以内に応答がありませんでした</div>'};x.send()}document.addEventListener('DOMContentLoaded',bootAdminView);</script></body></html>
