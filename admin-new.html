<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ASTERISK 管理</title>
    <style>
      body {
        font-size: 16px;
        line-height: 1.55;
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans JP",
          sans-serif;
        background: #f5f7fb;
        color: #172033;
        margin: 0;
      }
      main {
        max-width: 1050px;
        margin: auto;
        padding: 22px 12px;
      }
      .card {
        background: #fff;
        border: 1px solid #e4e8f0;
        border-radius: 16px;
        padding: 16px;
        margin: 12px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }
      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        min-height: 46px;
        font: inherit;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        margin: 4px 0;
      }
      .btn {
        display: inline-block;
        border: 0;
        border-radius: 9px;
        min-height: 46px;
        padding: 10px 14px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        margin: 3px;
        text-decoration: none;
      }
      .primary {
        background: #315be8;
        color: #fff;
      }
      .danger {
        background: #ffebee;
        color: #a52e3c;
      }
      .ok {
        background: #e9f8f1;
      }
      .warn {
        background: #fff5dc;
      }
      .line {
        background: #e8f8ee;
        color: #0b6b3a;
      }
      .muted {
        line-height: 1.5;
        color: #70798b;
        font-size: 13px;
      }
      .person {
        border-top: 1px solid #eee;
        padding: 10px 0;
      }
      .desired {
        background: #eef4ff;
        border-radius: 10px;
        padding: 9px;
        margin: 7px 0;
        font-weight: 900;
        line-height: 1.6;
      }
      .commentbox {
        background: #f7f9fc;
        border-left: 4px solid #315be8;
        border-radius: 8px;
        padding: 9px 11px;
        margin: 8px 0;
        white-space: pre-wrap;
      }
      .counts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 12px 0;
      }
      .count {
        min-width: 0;
        line-height: 1.45;
        background: #f7f9fc;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 12px;
        text-align: center;
        font-weight: 800;
      }
      .count b {
        display: block;
        font-size: 28px;
        margin-top: 3px;
      }
      #eventList { overflow-anchor: none; }
      .eventGroup {
        border: 2px solid #dfe5ef;
        border-radius: 18px;
        margin: 16px 0;
        overflow: hidden;
        background: #fff;
      }
      .eventHead {
        padding: 14px 16px;
        background: #eef4ff;
        cursor: pointer;
      }
      .eventTitle {
        font-size: 18px;
        font-weight: 900;
        line-height: 1.5;
      }
      .applicant {
        border: 1px solid #e4e8f0;
        border-radius: 14px;
        padding: 12px;
        margin: 10px 0;
        background: #fff;
      }
      .applicantName {
        font-size: 17px;
        font-weight: 900;
      }
      .eventMeta {
        background: #eef4ff;
        border-radius: 10px;
        padding: 9px 11px;
        margin: 8px 0;
        font-weight: 800;
        line-height: 1.6;
        color: #243b70;
      }
      .visitorBody {
        padding: 4px 14px 14px;
      }
      .statusline {
        margin: 8px 0;
      }
      .visitorActions {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .visitorActions .btn {
        margin: 2px;
      }
      .sectionHint {
        font-size: 13px;
        color: #64748b;
        margin-top: 3px;
      }
      @media (max-width: 700px) {
        .counts {
          grid-template-columns: 1fr 1fr;
        }
      }
      .history {
        font-size: 13px;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .event-applications {
        margin: 14px 0 4px;
        border: 1px solid #f0d8a7;
        border-radius: 12px;
        overflow: hidden;
        background: #fffdf7;
      }
      .event-applications > summary {
        min-height: 48px;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 800;
        color: #765000;
        background: #fff7e6;
      }
      .event-applications[open] > summary { border-bottom: 1px solid #f0d8a7; }
      .application-slot .visitorBody { padding: 8px 12px 14px; }
      .roster {
        margin: 14px 0 4px;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      .roster > summary {
        min-height: 48px;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 800;
        background: #f4f7ff;
        color: #203a78;
      }
      .roster-body { padding: 4px 12px 10px; }
      .roster-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 10px 2px;
        border-bottom: 1px solid #e9edf4;
      }
      .roster-row:last-child { border-bottom: 0; }
      .roster-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:4px; max-width:230px; }
      @media(max-width:600px) { .roster-row { grid-template-columns:auto minmax(0,1fr); } .roster-actions { grid-column:1 / -1; justify-content:flex-start; max-width:none; } }
      .roster-main { min-width: 0; overflow-wrap: anywhere; }
      .roster-type, .roster-status {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }
      .roster-type.member { background: #e8efff; color: #294fc4; }
      .roster-type.visitor { background: #fff1dd; color: #815200; }
      .roster-status.confirmed { background: #e6f7ed; color: #146c43; }
      .roster-status.waiting { background: #fff5d9; color: #795600; }
      .event-edit {
        margin: 16px 0 4px;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        background: #f8faff;
      }
      .event-edit > summary,
      .bulk-edit > summary {
        min-height: 46px;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 800;
        color: #203a78;
      }
      .event-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 12px;
        padding: 0 12px 14px;
      }
      .event-form label {
        display: grid;
        gap: 2px;
        font-size: 14px;
        font-weight: 700;
        color: #334155;
      }
      .event-form .wide,
      .event-form .form-actions { grid-column: 1 / -1; }
      .event-form textarea { min-height: 90px; }
      .event-form .form-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .event-edit[open] > summary,
      .bulk-edit[open] > summary { border-bottom: 1px solid #dbe3ef; }
      .bulk-edit > summary { list-style: none; }
      .bulk-edit > summary::-webkit-details-marker { display: none; }
      .bulk-edit > summary::before,
      .event-edit > summary::before { content: "+"; margin-right: 10px; font-size: 20px; }
      .event-edit[open] > summary::before,
      .bulk-edit[open] > summary::before { content: "−"; }
      .tabs {
        display: flex;
        gap: 7px;
        overflow: auto;
        margin: 7px 0;
      }
      .tabs button {
        white-space: nowrap;
        border: 1px solid #ccd4e2;
        background: #fff;
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 800;
      }
      .tabs .on {
        background: #315be8;
        color: #fff;
      }
      @media (max-width: 700px) {
        main { padding: 14px 10px; }
        .card { padding: 14px; border-radius: 14px; }
        .counts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .counts .count:last-child:nth-child(3) { grid-column: 1 / -1; }
        .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
        .eventTitle { font-size: 16px; }
      }
      @media (max-width: 420px) {
        .event-form, .grid { grid-template-columns: 1fr; }
        .counts { grid-template-columns: 1fr; }
        .counts .count:last-child:nth-child(3) { grid-column: auto; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ASTERISK 管理者ページ</h1>
      <section id="login" class="card">
        <input id="pin" type="password" placeholder="管理PIN" /><button
          class="btn primary"
          onclick="loginNow()"
        >
          ログイン
        </button>
      </section>
      <div id="app" hidden>
        <section id="passwordResetResult" class="card" hidden aria-live="polite"></section>
        <section class="card">
          <details class="bulk-edit">
            <summary>日程を一括追加・更新</summary>
          <p class="muted">
            1行につき「日付,曜日,開始,終了,レベル/タイトル,会場,定員,参加費」の順で入力してください。
          </p>
          <textarea
            id="bulk"
            rows="7"
            placeholder="2026-09-12,土,18:00,21:00,🌸,練馬特別支援,20,400"
          ></textarea
          ><button class="btn primary" onclick="bulkSave()">一括反映</button>
          </details>
        </section>
        <div id="months" class="tabs"></div>
        <div id="marks" class="tabs"></div>
        <section class="card">
          <details>
            <summary style="font-weight: 900; font-size: 18px; cursor: pointer">
              👥 正規メンバー登録状況 <span id="memberCount"></span>
            </summary>
            <div id="genderCount" class="counts"></div>
            <details>
              <summary
                style="font-weight: 800; cursor: pointer; padding: 10px 0"
              >
                📋 メンバー一覧を表示
              </summary>
              <label for="memberSearch">🔎 メンバー検索（本名・登録名）</label>
              <input id="memberSearch" type="search" placeholder="名前の一部を入力" oninput="renderMembers()" autocomplete="off">
              <div id="memberSearchCount" class="muted" role="status" aria-live="polite"></div>
              <div id="members"></div>
            </details>
          </details>
        </section>
        <div id="visitors" hidden></div>
        <section>
          <h2>各回ごとの変更</h2>
          <div id="eventList"></div>
        </section>
        <section class="card">
          <h2>変更履歴</h2>
          <div id="history"></div>
        </section>
      </div>
    </main>
    <script>
      const API =
          "https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/attendance-api",
        MARKS = ["🚹️", "⭐", "🌺", "🌸", "💎", "🏐", "✡️", "🌠"];
      let P = "",
        D = { events: [], responses: [], visitors: [], history: [] },
        month = "all",
        mark = "all";
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      function memberLine(member) {
        const line = String(member?.line_url || "").trim();
        if (!line) return '<span class="muted" style="color:#b42318;font-weight:800">LINE：未登録（この状態ではパスワードをリセットしてもログインできません。本人確認後にLINE URLの登録が必要です）</span>';
        const label = '<div class="muted" style="overflow-wrap:anywhere">LINE：' + esc(line) + '</div>';
        return label + (/^https:\/\/line\.me\//i.test(line)
          ? '<a class="btn line" href="' + esc(line) + '" target="_blank" rel="noopener noreferrer">📱 LINEを開く</a>'
          : '<span class="muted">LINE URLを確認してください</span>');
      }
      function responseMember(r) {
        return (D.members || []).find((m) => m.id === r.member_id) || r.attendance_members || r;
      }
      async function call(a, b) {
        const r = await fetch(API + "?action=" + a, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(b || {}),
          }),
          j = await r.json();
        if (!r.ok) {
          const detail = j && (j.error || j.message || j.details);
          const message = typeof detail === "string" ? detail : detail ? JSON.stringify(detail) : "通信エラー (HTTP " + r.status + ")";
          throw Error(message);
        }
        return j;
      }
      async function loginNow() {
        try {
          P = pin.value;
          await call("admin-login", { pin: P });
          login.hidden = true;
          app.hidden = false;
          await load();
        } catch (e) {
          alert(e.message);
        }
      }
      async function load() {
        D = await call("admin-bootstrap", { pin: P });
        // Normalize legacy tournament markers for Nov 2026 through Jan 2027 in the UI.
        if (Array.isArray(D.events)) D.events.forEach(e => {
          if (/^2026-(11|12)-|^2027-01-/.test(String(e.event_date || "")) && typeof e.title === "string") {
            e.title = e.title.replace(/🔯/g, "✡️");
          }
        });
        D.responses = (D.responses || []).map(function (r) {
          var m = r.attendance_members || {};
          return Object.assign({}, r, {
            display_name: m.display_name || r.display_name || "",
            real_name: m.real_name || r.real_name || "",
            gender: m.gender || r.gender || "",
          });
        });
        render();
      }
      function pickMonth(x) {
        month = x;
        render();
      }
      function pickMark(x) {
        mark = x;
        render();
      }
      function eventById(id) {
        return D.events.find((e) => e.id === id);
      }
      function eventLine(e) {
        if (!e) return "日程情報なし";
        return (
          esc(e.event_date || "") +
          " " +
          esc(e.day_label || "") +
          " " +
          String(e.start_time || "").slice(0, 5) +
          "-" +
          String(e.end_time || "").slice(0, 5) +
          " / " +
          esc(e.venue || "")
        );
      }
      function captureAdminView() {
        const panels = new Map(
          Array.from(document.querySelectorAll("details[data-view-key]"),
            (panel) => [panel.dataset.viewKey, panel.open]),
        );
        const anchor = Array.from(document.querySelectorAll(".event-card")).find(
          (card) => card.getBoundingClientRect().bottom > 0,
        );
        return {
          panels,
          x: window.scrollX,
          y: window.scrollY,
          eventId: anchor?.dataset.eventId,
          top: anchor?.getBoundingClientRect().top,
        };
      }
      function restoreAdminView(view) {
        document.querySelectorAll("details[data-view-key]").forEach((panel) => {
          if (view.panels.has(panel.dataset.viewKey))
            panel.open = view.panels.get(panel.dataset.viewKey);
        });
        const anchor = Array.from(document.querySelectorAll(".event-card")).find(
          (card) => card.dataset.eventId === view.eventId,
        );
        const y = anchor
          ? window.scrollY + anchor.getBoundingClientRect().top - view.top
          : view.y;
        window.scrollTo({ left: view.x, top: y, behavior: "instant" });
      }

      function unifiedApplications(rs, vs) {
        return [
          ...rs.filter(r => ["yes", "waitlist", "maybe"].includes(r.status)).map(r => ({...r, kind:"member"})),
          ...vs.filter(v => ["approved", "pending"].includes(v.status)).map(v => ({...v, kind:"visitor"})),
        ].sort((a,b) => {
          const ta=Date.parse(a.created_at), tb=Date.parse(b.created_at);
          const delta=(Number.isFinite(ta)?ta:Infinity)-(Number.isFinite(tb)?tb:Infinity);
          return (Number.isNaN(delta)?0:delta) || (a.kind+":"+a.id).localeCompare(b.kind+":"+b.id);
        });
      }
      function renderUnifiedRoster(rs, vs) {
        let waiting=0;
        return unifiedApplications(rs,vs).map((r,index) => {
          const member=r.kind==="member";
          const confirmed=member?r.status==="yes":r.status==="approved";
          const status=confirmed?"参加確定":(r.status==="waitlist"||r.waitlist)?"キャンセル待ち":member?"未定":"承認待ち";
          const name=member?(r.attendance_members?.display_name||r.display_name||"名前未取得"):(r.display_name||"名前未取得");
          const realName=member?(r.attendance_members?.real_name||r.real_name||""):"";
          const date=Date.parse(r.created_at);
          const time=Number.isFinite(date)?new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date(date)):"申請日時未記録";
          const rank=confirmed?"":'<span class="roster-status waiting">待機 '+(++waiting)+'番</span> ';
          return '<div class="roster-row"><span class="roster-type '+r.kind+'">'+(member?"正規":"ビジター")+'</span><div class="roster-main"><b>'+esc(name)+(realName?'（'+esc(realName)+'）':"")+(Number(r.guest_count||0)?' ＋同伴'+Number(r.guest_count||0)+'人':"")+'</b><div class="muted">申請順 '+(index+1)+'・'+esc(time)+'</div></div><div class="roster-actions">'+(member?memberLine(responseMember(r)):"")+rank+'<span class="roster-status '+(confirmed?"confirmed":"waiting")+'">'+status+'</span>'+(!confirmed?'<button type="button" class="btn primary" onclick="confirmApplicant(\''+r.kind+'\',\''+r.id+'\')">参加に追加</button>':"")+'</div></div>';
        }).join("") || '<div class="muted" style="padding:10px 2px">参加申請はありません。</div>';
      }
      async function confirmApplicant(kind,id) {
        const row=(kind==="member"?D.responses:D.visitors).find(r=>r.id===id);
        if(!row)return alert("申請が見つかりません。再読み込みしてください");
        try {
          if(kind==="member")await call("admin-change-response",{pin:P,id,status:"yes",comment:row.comment||""});
          else await call("admin-visitor-status",{pin:P,id,status:"approved"});
          await load();
        } catch(e) { alert(e.message); }
      }

      function render() {
        const view = captureAdminView();
        const ms = [
          ...new Set(D.events.map((e) => String(e.event_date).slice(0, 7))),
        ].sort();
        months.innerHTML = [
          ["all", "すべて"],
          ...ms.map((x) => [x, +x.slice(5) + "月"]),
        ]
          .map(
            (x) =>
              '<button class="' +
              (month === x[0] ? "on" : "") +
              '" onclick="pickMonth(\'' +
              x[0] +
              "')\">" +
              x[1] +
              "</button>",
          )
          .join("");
        marks.innerHTML = [["all", "全マーク"], ...MARKS.map((x) => [x, x])]
          .map(
            (x) =>
              '<button class="' +
              (mark === x[0] ? "on" : "") +
              '" onclick="pickMark(\'' +
              x[0] +
              "')\">" +
              x[1] +
              "</button>",
          )
          .join("");
        const today = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Tokyo",
          }).format(new Date()),
          es = D.events.filter(
            (e) =>
              String(e.event_date) >= today &&
              (month === "all" || String(e.event_date).startsWith(month)) &&
              (mark === "all" || String(e.title).includes(mark)),
          ),
          visitorEvents = D.events.filter(
            (e) =>
              String(e.event_date) >= today &&
              (month === "all" || String(e.event_date).startsWith(month)) &&
              (mark === "all" || String(e.title).includes(mark)),
          ),
          ids = new Set(es.map((e) => e.id)),
          friendCount = D.responses
            .filter((r) => ids.has(r.event_id) && r.status === "yes")
            .reduce((n, r) => n + Number(r.guest_count || 0), 0);
        eventList.innerHTML =
          es
            .map((e) => {
              const rs = D.responses.filter((r) => r.event_id === e.id),
                vs = D.visitors.filter((v) => v.event_id === e.id),
                memberYes = rs.filter((r) => r.status === "yes").length,
                memberFriends = rs
                  .filter((r) => r.status === "yes")
                  .reduce((n, r) => n + Number(r.guest_count || 0), 0),
                visitorApproved = vs
                  .filter((v) => v.status === "approved" && !v.waitlist)
                  .reduce((n, v) => n + 1 + Number(v.guest_count || 0), 0),
                visitorPending = vs
                  .filter((v) => v.status === "pending" && !v.waitlist)
                  .reduce((n, v) => n + 1 + Number(v.guest_count || 0), 0),
                visitorApplied = vs.filter(v => ["approved", "pending"].includes(v.status)).reduce((n,v) => n + 1 + Number(v.guest_count || 0), 0),
                memberApplied = rs
                  .filter((r) =>
                    ["yes", "waitlist", "maybe"].includes(r.status),
                  )
                  .reduce((n, r) => n + 1 + Number(r.guest_count || 0), 0),
                applied = memberApplied + visitorApplied,
                participating = memberYes + memberFriends + visitorApproved;
              const activeRegulars = rs.filter((r) =>
                  ["yes", "waitlist", "maybe"].includes(r.status),
                ),
                activeVisitors = vs.filter((v) =>
                  ["approved", "pending"].includes(v.status),
                ),
                rosterRows = renderUnifiedRoster(rs, vs);
              return (
                '<section class="card event-card" data-event-id="' + e.id + '"><h2>' +
                esc(e.event_date) +
                " " +
                esc(e.day_label || "") +
                " " +
                String(e.start_time || "").slice(0, 5) +
                "-" +
                String(e.end_time || "").slice(0, 5) +
                "｜" +
                esc(e.venue || "") +
                '</h2><div class="counts"><div class="count">この回の申請<b>' +
                applied +
                '人</b><span class="muted">正規 ' +
                memberApplied +
                " / ビジター " +
                visitorApplied +
                '</span></div><div class="count">この回の参加確定<b>' +
                participating +

(Number(r.guest_count || 0) > 0

                      '</div><div class="muted">性別 ' +
                      esc(v.gender || "") +
                      "・年齢 " +
                      esc(v.age || "") +
                      "・バレー歴 " +
                      esc(v.volleyball_history || "") +
                      "<br>LINE " +
                      esc(line) +
                      '</div><div class="commentbox"><b>💬 申請コメント</b><br>' +

                      '" value="' +

                      '" placeholder="コメント">' +

                      '</textarea><button class="btn primary" onclick="saveVisitor(\'' +

                      (v.status === "cancelled"

        document.querySelectorAll("#visitors .visitorBody[data-event-id]").forEach((body) => {

          maleCount = allMembers.filter((m) => m.gender === "男性").length,

      function normalizeMemberSearch(value) {
        return String(value || "").normalize("NFKC").toLowerCase()
          .replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
          .replace(/\s+/g, "");
      }
      function renderMembers() {
        const allMembers = D.members || [];
        const query = normalizeMemberSearch(document.getElementById("memberSearch").value);
        const matchedMembers = allMembers.filter((m) =>
          [m.real_name, m.display_name].some((name) => normalizeMemberSearch(name).includes(query))
        );
        document.getElementById("memberSearchCount").textContent =
          "表示 " + matchedMembers.length + "人 ／ 全" + allMembers.length + "人";
        document.getElementById("members").innerHTML =
          matchedMembers
            .map(
              (m) =>
                '<div class="person"><b>' +
                esc(m.display_name || "") +
                '</b><div class="muted">本名：' +
                esc(m.real_name || "") +
                " ／ 性別：" +
                esc(m.gender || "未設定") +
                '</div>' + memberLine(m) + '<div style="margin:8px 0"><label>LINE URL登録・変更（本人確認後）</label><input id="line-' + esc(m.id) + '" type="url" placeholder="https://line.me/..." value="' + esc(m.line_url || "") + '"><button class="btn primary" onclick="saveMemberLine(\'' + esc(m.id) + '\')">LINE URLを保存</button></div><button class="btn warn" onclick="resetMemberPassword(\'' +
                esc(m.id) +
                "')\">パスワードをリセット</button></div>",
            )
            .join("") || '<div class="muted">' + (allMembers.length ? '該当するメンバーはいません。' : '登録メンバーはいません。') + '</div>';
      }
      async function saveMemberLine(id) {
        const field = document.getElementById("line-" + id);
        const line_url = (field?.value || "").trim();
        try {
          const u = new URL(line_url);
          if (u.protocol !== "https:" || u.hostname !== "line.me" || u.pathname === "/") throw Error("invalid");
        } catch { alert("https://line.me/ から始まる正しいLINE URLを入力してください"); return; }
        if (!confirm("本人確認済みのメンバーのLINE URLを保存しますか？")) return;
        try {
          await call("admin-set-member-line", { pin: P, id, line_url });
          alert("LINE URLを保存しました");
          await load();
        } catch(e) { alert("保存できませんでした：" + (e.message || "サーバー側の対応を確認してください")); }
      }
      async function resetMemberPassword(id) {
        if (!confirm("本人確認をしたうえで、このメンバーのパスワードをリセットしますか？\nログイン中の端末はすべてログアウトされます。")) return;
        try {
          const result = await call("admin-reset-member-password", { pin: P, id });
          const panel = document.getElementById("passwordResetResult");
          panel.hidden = false;
          panel.innerHTML =
            '<b>一時パスワード（対象の方へ個別に伝えてください）</b>' +
            '<input id="temporaryPasswordValue" type="text" readonly value="' +
            esc(result.temporary_password || "") +
            '" aria-label="一時パスワード">' +
            '<button type="button" class="btn primary" onclick="copyTemporaryPassword()">一時パスワードをコピー</button>' +
            '<p class="muted">本人がログインすると、新しいパスワードの設定が必要です。画面を閉じる前に控えてください。</p>';
          panel.scrollIntoView({ behavior: "smooth", block: "center" });
        } catch (e) {
          alert(e.message || "リセットできませんでした");
        }
      }
      async function copyTemporaryPassword() {
        const field = document.getElementById("temporaryPasswordValue");
        if (!field) return;
        field.focus();
        field.select();
        try {
          await navigator.clipboard.writeText(field.value);
          alert("一時パスワードをコピーしました");
        } catch (e) {
          alert("一時パスワードを選択しました。コピーしてください。");
        }
      }
      async function deleteHistory(id) {
        if (!confirm("この履歴を削除しますか？")) return;
        try {
          await call("admin-delete-history", { pin: P, id });
          await load();
        } catch (e) {
          alert(e.message);
        }
      }
      async function saveEvent(id) {
        try {
          await call("admin-update-event", {
            pin: P,
            id,
            event_date: document.getElementById("d-" + id).value,
            day_label: document.getElementById("w-" + id).value,
            start_time: document.getElementById("s-" + id).value,
            end_time: document.getElementById("x-" + id).value,
            title: document.getElementById("t-" + id).value,
            venue: document.getElementById("v-" + id).value,
            capacity: +document.getElementById("cap-" + id).value,
            participation_fee: +document.getElementById("fee-" + id).value,
            note: document.getElementById("n-" + id).value,
            is_hidden: document.getElementById("h-" + id).value === "true",
            paypay_enabled: false,
            tags: "",
          });
          await load();
          alert("保存しました");
        } catch (e) {
          alert(e.message);
        }
      }
      async function delEvent(id) {
        if (!confirm("この日程を削除しますか？")) return;
        try {
          await call("admin-delete-event", { pin: P, id });
          await load();
        } catch (e) {
          alert(e.message);
        }
      }
      async function saveResponse(id) {
        try {
          await call("admin-change-response", {
            pin: P,
            id,
            status: document.getElementById("rs-" + id).value,
            comment: document.getElementById("rc-" + id).value,
          });
          await load();
          alert("出欠を変更しました");
        } catch (e) {
          alert(e.message);
        }
      }
      async function moveResponse(id) {
        const s = document.getElementById("rm-" + id);
        if (!s || !s.value)
          return alert("同日に変更できる別の練習回がありません");
        if (!confirm("この正規メンバーの参加を選択した練習回へ変更しますか？")) return;
        try {
          await call("admin-move-response", { pin: P, id, event_id: s.value });
          await load();
          alert("練習回を変更しました");
        } catch (e) {
          alert(e.message);
        }
      }
      async function moveVisitor(id) {
        const s = document.getElementById("vm-" + id);
        if (!s || !s.value)
          return alert("同日に変更できる別の練習回がありません");
        if (!confirm("この申請を選択した練習回へ変更しますか？")) return;
        try {
          await call("admin-move-visitor", { pin: P, id, event_id: s.value });
          await load();
          alert("練習回を変更しました");
        } catch (e) {
          alert(e.message);
        }
      }
      async function saveVisitor(id) {
        try {
          await call("admin-edit-visitor", {
            pin: P,
            id,
            display_name: document.getElementById("vn-" + id).value,
            gender: document.getElementById("vg-" + id).value,
            age: document.getElementById("va-" + id).value,
            volleyball_history: document.getElementById("vh-" + id).value,
            desired_position: document.getElementById("vp-" + id).value,
            contact: document.getElementById("vc-" + id).value,
            guest_count: +document.getElementById("vgu-" + id).value,
            comment: document.getElementById("vco-" + id).value,
          });
          await load();
          alert("申請内容を修正しました");
        } catch (e) {
          alert(e.message);
        }
      }
      async function vstat(id, status) {
        try {
          await call("admin-visitor-status", { pin: P, id, status });
          await load();
        } catch (e) {
          alert(e.message);
        }
      }
      async function restoreVisitor(id) {
        if (!confirm("このキャンセル済み申請を承認待ちへ戻しますか？")) return;
        try {
          await vstat(id, "pending");
        } catch (e) {
          alert(e.message);
        }
      }
      async function deleteRejectedVisitor(id) {
        if (!confirm("この却下済み申請を削除しますか？")) return;
        try {
          await call("admin-delete-rejected-visitor", { pin: P, id });
          await load();
        } catch (e) {
          alert(e.message);
        }
      }
      async function bulkSave() {
        const events = bulk.value
          .split(/\n/)
          .map((x) => x.trim())
          .filter(Boolean)
          .map((line) => {
            const a = line.split(",").map((x) => x.trim());
            return {
              event_date: a[0],
              day_label: a[1],
              start_time: a[2],
              end_time: a[3],
              title: (a[4] || "").replace(/🔯/g, "✡️"),
              venue: a[5],
              capacity: +(a[6] || 20),
              participation_fee: +(a[7] || 400),
              paypay_enabled: false,
              note: "",
              tags: "",
              is_hidden: false,
            };
          });
        if (!events.length) return alert("日程を入力してください");
        try {
          await call("admin-upsert-events", { pin: P, events });
          await load();
          alert("一括反映しました");
        } catch (e) {
          alert(e.message);
        }
      } <!-- deploy-admin-controls-20260920 -->
    </script>
